name: Release installers

# Push a tag like v0.3.0 to build the desktop installers and attach them to a
# release. workflow_dispatch builds the installers as run artifacts only (no
# release). Each installer bundles the frozen FastAPI backend as a Tauri
# sidecar; Windows also carries the OpenFOAM pack coordinates for first-run setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-13
            target: macos-x64
          - os: macos-14
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps for Tauri
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install JS deps
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Bake the OpenFOAM pack coordinates
        shell: bash
        run: |
          cat > backend/app/services/setup/pack.json <<JSON
          {
            "url": "${{ vars.OPENCFD_FOAM_PACK_URL }}",
            "sha256": "${{ vars.OPENCFD_FOAM_PACK_SHA256 }}",
            "version": "${{ vars.OPENCFD_FOAM_PACK_VERSION }}"
          }
          JSON
          cat backend/app/services/setup/pack.json

      - name: Freeze the backend sidecar
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt
          pyinstaller --noconfirm --clean opencfd-backend.spec
          python -c "import os; print(os.listdir('dist'))"

      - name: Stage the sidecar for Tauri
        shell: bash
        run: |
          set -euxo pipefail
          triple=$(rustc -Vv | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp "backend/dist/opencfd-backend.exe" "src-tauri/binaries/opencfd-backend-${triple}.exe"
          else
            cp "backend/dist/opencfd-backend" "src-tauri/binaries/opencfd-backend-${triple}"
            chmod +x "src-tauri/binaries/opencfd-backend-${triple}"
          fi
          ls -la src-tauri/binaries

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenCFD {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers as run artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: opencfd-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
