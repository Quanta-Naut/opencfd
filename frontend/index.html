<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCFD Studio</title>
    <script>
      // Apply the theme before first paint so there is no light flash in dark
      // mode. Mirrors utils/theme.ts (key 'opencfd_theme', default 'system').
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('opencfd_theme') || 'system'; } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
